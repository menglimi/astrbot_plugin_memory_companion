name: astrbot_plugin_memory_companion
display_name: 我会牢牢记住你
author: menglimi
author_url: https://github.com/menglimi
version: 2.6.5
description: 她会记得你这个人：怎么叫你、你们是什么关系、你对她有多重、什么该留原文什么该自然淡掉。装上就能用，不用配置。
desc: 为 AstrBot 陪伴体系提供按人组织的长期记忆。每轮开口前先想起眼前这个人（人物卡：名字、称呼、关系、分量、几件最牢的事），刻骨的话留原文，在乎的人忘得慢、只聊过几句的淡得快，分量由她自己掂量、也能被你一句话纠正。带「她记得的人」面板：看人、改称呼、把分量往上往下挪、让她忘掉某件事。另有历史聊天导入、权限边界、知识图谱、陪伴插件桥接与运行诊断。
repo: https://github.com/menglimi/astrbot_plugin_memory_companion
category: AI 增强
tags:
  - 长期记忆
  - 核心记忆
  - 关系边界
  - 自我时间线
  - 记忆迁移
  - 历史对话导入
  - 可视化管理
  - 陪伴体系
icon: logo.png
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.27,<5"

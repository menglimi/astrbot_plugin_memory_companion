<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e8e5e1" />
  <title>Memory OS · 拓展页</title>
  <script>
    (async () => {
      let style = "legacy";
      try {
        const response = await fetch("/api/v1/plugins/extensions/astrbot_plugin_memory_companion/page/ui-preferences", { credentials: "same-origin", cache: "no-store" });
        const payload = await response.json();
        style = payload?.ui_style === "modern" || payload?.data?.ui_style === "modern" ? "modern" : "legacy";
      } catch (_) {}
      // AstrBot signs extension page URLs with asset_token. Keep the token
      // when switching from this selector page to the actual UI; mobile
      // WebViews often do not have the dashboard cookie available.
      const target = new URL(style === "modern" ? "./modern.html" : "./legacy.html", location.href);
      target.search = location.search;
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body><main style="padding:32px;font-family:system-ui;color:#777">正在载入记忆终端…</main></body>
</html>
